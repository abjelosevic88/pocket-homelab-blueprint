name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-blueprint ./cmd/pocket-blueprint
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pst DEMO_DATA=true AUTH_MODE=none ./pocket-blueprint &
          sleep 4
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/codebases | grep -q '"status":"done"'
          SCAN=$(curl -fsS http://localhost:8080/api/v1/codebases | grep -o '"last_scan_id":[0-9]*' | head -1 | cut -d: -f2)
          curl -fsS http://localhost:8080/api/v1/scans/$SCAN/endpoints | grep -q '"method":"GET"'
          curl -fsS http://localhost:8080/api/v1/scans/$SCAN/openapi.json | grep -q '"openapi": "3.1.0"'
          curl -fsS "http://localhost:8080/api/v1/scans/$SCAN/graph?level=dir&depth=2" | grep -q '"edges":\[{'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-blueprint:pr
